<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Control | Savière Group</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@400;500;600&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Nunito Sans"','sans-serif'],serif:['Marcellus','serif'],ui:['Poppins','sans-serif']},colors:{saviere:{crimson:'#520A1E',gold:'#D4AF37',black:'#0A0A0A',white:'#FFFFFF'}}}}};</script>
</head>
<body class="bg-[#F5F5F5] text-black antialiased p-8 flex justify-center min-h-screen items-start">
    <div class="w-full max-w-4xl bg-white shadow-xl border border-black/10 p-12">
        
        <div class="border-b border-black/10 pb-8 mb-8 flex justify-between items-end">
            <div>
                <h1 class="font-serif text-3xl text-saviere-crimson mb-2">Editorial Dashboard</h1>
                <p class="font-ui text-[10px] uppercase tracking-widest text-black/50">Restricted Corporate Node</p>
            </div>
            <div class="font-ui text-[10px] uppercase tracking-widest text-black/30 border border-black/10 px-3 py-1 bg-gray-50">
                GitHub API Status: <span id="conn-status" class="text-yellow-600 font-bold">Awaiting Credentials</span>
            </div>
        </div>

        <form id="editor-form" class="space-y-8">
            <div class="grid grid-cols-2 gap-6 bg-gray-50 p-6 border border-black/5">
                <div>
                    <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-black/60 mb-2">GitHub PAT</label>
                    <input type="password" id="gh-token" required class="w-full border border-black/20 px-4 py-3 text-sm focus:outline-none focus:border-saviere-crimson" placeholder="ghp_...">
                </div>
                <div>
                    <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-black/60 mb-2">Repository</label>
                    <input type="text" id="gh-repo" required class="w-full border border-black/20 px-4 py-3 text-sm focus:outline-none focus:border-saviere-crimson" placeholder="owner/repo">
                </div>
            </div>

            <div>
                <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-black/60 mb-2">Headline</label>
                <input type="text" id="title" required class="w-full border border-black/20 px-4 py-3 text-sm focus:outline-none focus:border-saviere-crimson" placeholder="Savière Group announces...">
            </div>

            <div class="grid grid-cols-3 gap-6">
                <div>
                    <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-black/60 mb-2">Category</label>
                    <select id="category" class="w-full border border-black/20 px-4 py-3 text-sm focus:outline-none focus:border-saviere-crimson appearance-none bg-white">
                        <option value="Press Release">Press Release</option>
                        <option value="Media Coverage">Media Coverage</option>
                        <option value="Announcement">Announcement</option>
                    </select>
                </div>
                <div>
                    <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-black/60 mb-2">Publication Date</label>
                    <input type="text" id="date" required class="w-full border border-black/20 px-4 py-3 text-sm focus:outline-none focus:border-saviere-crimson" placeholder="e.g. September 2026">
                </div>
                <div>
                    <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-black/60 mb-2">State</label>
                    <select id="status" class="w-full border border-black/20 px-4 py-3 text-sm focus:outline-none focus:border-saviere-crimson appearance-none bg-white">
                        <option value="Published">Published (Live)</option>
                        <option value="Draft">Draft (Hidden)</option>
                        <option value="Archived">Archived</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-black/60 mb-2">Editorial Summary / Content</label>
                <textarea id="summary" required rows="5" class="w-full border border-black/20 px-4 py-3 text-sm focus:outline-none focus:border-saviere-crimson"></textarea>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-saviere-crimson text-white font-ui text-xs uppercase tracking-widest py-4 hover:bg-black transition-colors">
                Commit to Remote Protocol
            </button>
            <p id="feedback" class="text-center font-ui text-[10px] uppercase tracking-widest mt-4 hidden"></p>
        </form>
    </div>

    <script>
        document.getElementById('editor-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn'); const feedback = document.getElementById('feedback');
            btn.innerText = 'Transmitting...'; btn.disabled = true;
            feedback.className = 'text-center font-ui text-[10px] uppercase tracking-widest mt-4 text-saviere-gold block'; 
            feedback.innerText = 'Establishing Handshake...';

            const token = document.getElementById('gh-token').value; const repo = document.getElementById('gh-repo').value;
            const newRecord = { 
                id: Date.now().toString(), 
                title: document.getElementById('title').value, 
                category: document.getElementById('category').value, 
                date: document.getElementById('date').value, 
                status: document.getElementById('status').value, 
                summary: document.getElementById('summary').value 
            };

            try {
                let data = []; let sha = null;
                const getReq = await fetch(`https://api.github.com/repos/${repo}/contents/press-data.json`, { headers: { 'Authorization': `token ${token}` } });
                if (getReq.ok) { const res = await getReq.json(); sha = res.sha; data = JSON.parse(decodeURIComponent(escape(window.atob(res.content)))); }
                
                data.push(newRecord);
                const putReq = await fetch(`https://api.github.com/repos/${repo}/contents/press-data.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `docs(press): Upsert record - ${newRecord.title}`, content: window.btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))), sha: sha })
                });

                if (putReq.ok) {
                    feedback.className = 'text-center font-ui text-[10px] uppercase tracking-widest mt-4 text-green-700 block'; 
                    feedback.innerText = 'Record committed. Edge cache rebuilding.'; 
                    document.getElementById('title').value = ''; document.getElementById('summary').value = '';
                } else throw new Error('API Access Denied.');
            } catch (err) { 
                feedback.className = 'text-center font-ui text-[10px] uppercase tracking-widest mt-4 text-red-700 block'; 
                feedback.innerText = `Protocol Error: ${err.message}`; 
            }
            setTimeout(() => { btn.innerText = 'Commit to Remote Protocol'; btn.disabled = false; }, 3000);
        });
    </script>
</body>
</html>
