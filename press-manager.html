<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Control | Savière Group</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/android-chrome-192x192.png">
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@400;500;600;700&family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Nunito Sans"','sans-serif'],serif:['Marcellus','serif'],ui:['Poppins','sans-serif']},colors:{saviere:{crimson:'#520A1E',gold:'#D4AF37',black:'#0A0A0A',white:'#FFFFFF'}}}}};</script>
</head>
<body class="bg-[#050505] text-white antialiased min-h-screen flex flex-col font-sans">
    
    <header class="border-b border-white/10 bg-black sticky top-0 z-50">
        <div class="max-w-[90rem] mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="font-serif text-2xl text-saviere-gold">Editorial Dashboard</h1>
                <p class="font-ui text-[9px] uppercase tracking-widest text-white/40">Zero-Install GitHub Edge Gateway</p>
            </div>
            <div id="status-badge" class="font-ui text-[10px] font-bold uppercase tracking-widest text-yellow-500 border border-yellow-500/30 px-3 py-1 bg-yellow-500/10 rounded-sm">
                Awaiting Protocol
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-[90rem] mx-auto w-full px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 h-full">
        <!-- Sidebar: Authentication & Ledger -->
        <div class="lg:col-span-4 space-y-6 flex flex-col h-full">
            <div class="bg-white/5 border border-white/10 p-6 rounded-xl shadow-2xl">
                <h2 class="font-serif text-lg text-white mb-4 border-b border-white/10 pb-2">1. Authenticate</h2>
                <form id="auth-form" class="space-y-4">
                    <div>
                        <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-white/50 mb-2">GitHub PAT (Fine-Grained)</label>
                        <input type="password" id="gh-token" required class="w-full bg-black/80 border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white" placeholder="ghp_...">
                    </div>
                    <div>
                        <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-white/50 mb-2">Repository</label>
                        <input type="text" id="gh-repo" required class="w-full bg-black/80 border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white" placeholder="owner/repo">
                    </div>
                    <button type="submit" id="connect-btn" class="w-full bg-saviere-gold text-black font-ui text-xs font-bold uppercase tracking-widest py-3 rounded hover:bg-white transition-all">
                        Connect Database
                    </button>
                </form>
            </div>

            <div class="bg-white/5 border border-white/10 p-6 rounded-xl shadow-2xl flex-grow flex flex-col max-h-[50vh]">
                <div class="flex justify-between items-center border-b border-white/10 pb-2 mb-4">
                    <h2 class="font-serif text-lg text-white">2. Article Ledger</h2>
                    <button id="new-btn" class="font-ui text-[9px] uppercase tracking-widest text-saviere-gold hover:text-white border border-saviere-gold/30 px-2 py-1 rounded transition-colors hidden">
                        + New Post
                    </button>
                </div>
                <div id="article-list" class="space-y-2 overflow-y-auto pr-2">
                    <p class="text-xs text-white/40 italic font-light">Connect to fetch database...</p>
                </div>
            </div>
        </div>

        <!-- Main Editor -->
        <div class="lg:col-span-8 bg-white/5 border border-white/10 p-8 rounded-xl shadow-2xl flex flex-col">
            <h2 class="font-serif text-2xl text-saviere-gold mb-6 border-b border-white/10 pb-4">3. Editorial Composer</h2>
            
            <form id="editor-form" class="space-y-6 flex-grow flex flex-col">
                <input type="hidden" id="post-id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-white/50 mb-2">Headline</label>
                        <input type="text" id="post-title" required disabled class="w-full bg-black/80 border border-white/20 px-4 py-3 rounded text-lg font-serif focus:outline-none focus:border-saviere-gold text-white disabled:opacity-50">
                    </div>
                    
                    <div>
                        <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-white/50 mb-2">Category</label>
                        <select id="post-category" disabled class="w-full bg-black/80 border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white appearance-none disabled:opacity-50">
                            <option value="Press Release">Press Release</option>
                            <option value="Media Coverage">Media Coverage</option>
                            <option value="Company Announcement">Company Announcement</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-white/50 mb-2">Publication Date</label>
                        <input type="text" id="post-date" required disabled class="w-full bg-black/80 border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white disabled:opacity-50" placeholder="e.g. October 15, 2026">
                    </div>

                    <div>
                        <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-white/50 mb-2">Visibility State</label>
                        <select id="post-status" disabled class="w-full bg-black/80 border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white appearance-none disabled:opacity-50">
                            <option value="Published">Published (Live on Site)</option>
                            <option value="Draft">Draft (Hidden)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-white/50 mb-2">Media Attachment (Optional)</label>
                        <input type="file" id="post-media" accept="image/*" disabled class="w-full bg-black/80 border border-white/20 px-4 py-2 rounded text-xs focus:outline-none focus:border-saviere-gold text-white/70 disabled:opacity-50">
                        <input type="hidden" id="post-media-b64">
                    </div>
                </div>

                <div class="flex-grow flex flex-col pt-2">
                    <label class="block font-ui text-[10px] font-bold uppercase tracking-widest text-white/50 mb-2">Official Content</label>
                    <textarea id="post-content" required disabled class="w-full flex-grow bg-black/80 border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white min-h-[250px] disabled:opacity-50" placeholder="Draft the release here..."></textarea>
                </div>

                <div class="flex items-center gap-4 pt-4 border-t border-white/10">
                    <button type="submit" id="save-btn" disabled class="flex-grow bg-saviere-crimson text-white font-ui text-xs font-bold uppercase tracking-widest py-4 rounded hover:bg-saviere-gold hover:text-black transition-all shadow-lg disabled:opacity-50">
                        Commit to Live Server
                    </button>
                    <button type="button" id="delete-btn" class="hidden bg-red-900/40 text-red-400 border border-red-500/30 font-ui text-xs font-bold uppercase tracking-widest px-6 py-4 rounded hover:bg-red-600 hover:text-white transition-all">
                        Eradicate
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        let database = [];
        let currentSha = null;

        const ui = {
            authForm: document.getElementById('auth-form'),
            token: document.getElementById('gh-token'),
            repo: document.getElementById('gh-repo'),
            btnConnect: document.getElementById('connect-btn'),
            badge: document.getElementById('status-badge'),
            list: document.getElementById('article-list'),
            btnNew: document.getElementById('new-btn'),
            form: document.getElementById('editor-form'),
            btnSave: document.getElementById('save-btn'),
            btnDelete: document.getElementById('delete-btn'),
            mediaUpload: document.getElementById('post-media'),
            mediaBase64: document.getElementById('post-media-b64'),
            fields: ['post-id', 'post-title', 'post-category', 'post-date', 'post-status', 'post-content']
        };

        // Base64 Encoding Safe for UTF-8 (Emojis, Quotes)
        const utoa = (data) => btoa(unescape(encodeURIComponent(data)));
        const atou = (b64) => decodeURIComponent(escape(atob(b64)));

        // Handle Media Conversion
        ui.mediaUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => { ui.mediaBase64.value = event.target.result; };
                reader.readAsDataURL(file);
            }
        });

        function enableEditor() {
            ui.fields.forEach(id => document.getElementById(id).disabled = false);
            ui.mediaUpload.disabled = false;
            ui.btnSave.disabled = false;
            ui.btnNew.classList.remove('hidden');
        }

        // 1. Connect & Fetch Data
        ui.authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = ui.token.value.trim(); const repo = ui.repo.value.trim();
            
            ui.badge.innerText = "Syncing..."; 
            ui.badge.className = "font-ui text-[10px] font-bold uppercase tracking-widest text-blue-400 border border-blue-400/30 px-3 py-1 bg-blue-400/10 rounded-sm";
            
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/press-data.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (res.status === 404) {
                    // File doesn't exist, we will create it on first save
                    database = []; currentSha = null;
                } else if (!res.ok) {
                    throw new Error("Invalid Repo or Token Permissions");
                } else {
                    const fileData = await res.json();
                    currentSha = fileData.sha;
                    database = JSON.parse(atou(fileData.content));
                }

                ui.badge.innerText = "Connected"; 
                ui.badge.className = "font-ui text-[10px] font-bold uppercase tracking-widest text-green-400 border border-green-400/30 px-3 py-1 bg-green-400/10 rounded-sm";
                enableEditor();
                renderList();
            } catch (err) {
                ui.badge.innerText = "Auth Failed"; 
                ui.badge.className = "font-ui text-[10px] font-bold uppercase tracking-widest text-red-400 border border-red-400/30 px-3 py-1 bg-red-400/10 rounded-sm";
                alert(err.message);
            }
        });

        // 2. Render Left Sidebar
        function renderList() {
            ui.list.innerHTML = '';
            if(database.length === 0) { ui.list.innerHTML = '<p class="text-xs text-white/40 italic">No entries exist yet.</p>'; return; }
            
            [...database].reverse().forEach(article => {
                const div = document.createElement('div');
                div.className = "p-3 border border-white/10 rounded hover:border-saviere-gold cursor-pointer transition-colors bg-black/40";
                div.innerHTML = `
                    <p class="font-ui text-[9px] uppercase tracking-widest text-saviere-gold mb-1">${article.date} • ${article.status}</p>
                    <p class="font-serif text-sm text-white truncate">${article.title}</p>
                `;
                div.onclick = () => loadArticle(article.id);
                ui.list.appendChild(div);
            });
        }

        // 3. Load Article into Form
        function loadArticle(id) {
            const article = database.find(a => a.id === id);
            if(!article) return;
            document.getElementById('post-id').value = article.id;
            document.getElementById('post-title').value = article.title;
            document.getElementById('post-category').value = article.category;
            document.getElementById('post-date').value = article.date;
            document.getElementById('post-status').value = article.status;
            document.getElementById('post-content').value = article.content;
            ui.mediaBase64.value = article.media || '';
            ui.btnDelete.classList.remove('hidden');
        }

        // New Post Reset
        ui.btnNew.addEventListener('click', () => {
            ui.form.reset();
            document.getElementById('post-id').value = '';
            ui.mediaBase64.value = '';
            ui.btnDelete.classList.add('hidden');
        });

        // 4. Commit to GitHub API
        ui.form.addEventListener('submit', async (e) => {
            e.preventDefault();
            ui.btnSave.innerText = "Encrypting & Pushing..."; ui.btnSave.disabled = true;

            const articleData = {
                id: document.getElementById('post-id').value || Date.now().toString(),
                title: document.getElementById('post-title').value,
                category: document.getElementById('post-category').value,
                date: document.getElementById('post-date').value,
                status: document.getElementById('post-status').value,
                content: document.getElementById('post-content').value,
                media: ui.mediaBase64.value
            };

            const existingIndex = database.findIndex(a => a.id === articleData.id);
            if(existingIndex >= 0) { database[existingIndex] = articleData; } 
            else { database.push(articleData); }

            await executePush(`docs(press): Commit "${articleData.title}"`);
        });

        // 5. Delete Logic
        ui.btnDelete.addEventListener('click', async () => {
            const id = document.getElementById('post-id').value;
            if(!id || !confirm("Permanently eradicate this record?")) return;
            ui.btnDelete.innerText = "Deleting...";
            database = database.filter(a => a.id !== id);
            await executePush(`docs(press): Eradicate record`);
            ui.btnNew.click();
        });

        // Core Push Engine
        async function executePush(message) {
            const token = ui.token.value; const repo = ui.repo.value;
            const contentPayload = utoa(JSON.stringify(database, null, 2));
            
            try {
                const reqBody = { message: message, content: contentPayload };
                if (currentSha) reqBody.sha = currentSha; // Required if updating existing file

                const putReq = await fetch(`https://api.github.com/repos/${repo}/contents/press-data.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(reqBody)
                });

                if(putReq.ok) {
                    const res = await putReq.json();
                    currentSha = res.content.sha;
                    renderList();
                    ui.btnSave.innerText = "Deployment Successful";
                    ui.btnDelete.innerText = "Eradicate";
                } else throw new Error("Push Rejected. Check Token Permissions.");
            } catch(err) {
                alert(err.message);
                ui.btnSave.innerText = "Commit to Live Server";
            }
            setTimeout(() => { ui.btnSave.innerText = "Commit to Live Server"; ui.btnSave.disabled = false; }, 3000);
        }
    </script>
</body>
</html>
