<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal | Savière Group</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/android-chrome-192x192.png">
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@300;400;500;600;700&family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={theme:{extend:{fontFamily:{sans:['"Nunito Sans"','sans-serif'],serif:['Marcellus','serif'],ui:['Poppins','sans-serif']},colors:{saviere:{crimson:'#520A1E',gold:'#D4AF37',black:'#0A0A0A',white:'#FFFFFF'}}}}};
    </script>
</head>
<body class="bg-saviere-black text-white antialiased min-h-screen flex flex-col font-sans">
    <header class="border-b border-white/10 bg-[#0A0A0A] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="font-serif text-2xl text-saviere-gold">Editorial Dashboard</h1>
                <p class="font-ui text-[9px] uppercase tracking-widest text-white/40">Secure GitHub Edge Gateway</p>
            </div>
            <div id="status-badge" class="font-ui text-[10px] font-bold uppercase tracking-widest text-yellow-500 border border-yellow-500/30 px-3 py-1 bg-yellow-500/10 rounded-sm">
                Awaiting Connection
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Sidebar: Auth & Ledger -->
        <div class="lg:col-span-4 space-y-6 flex flex-col">
            <div class="bg-white/5 border border-white/10 p-6 rounded-xl">
                <h2 class="font-serif text-lg text-white mb-4 border-b border-white/10 pb-2">1. Protocol Auth</h2>
                <div class="space-y-4">
                    <input type="password" id="gh-token" class="w-full bg-black border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white" placeholder="GitHub PAT (ghp_...)">
                    <input type="text" id="gh-repo" class="w-full bg-black border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white" placeholder="owner/repo">
                    <button id="connect-btn" class="w-full bg-saviere-gold text-black font-ui text-xs font-bold uppercase tracking-widest py-3 rounded hover:bg-white transition-all">Connect Database</button>
                </div>
            </div>

            <div class="bg-white/5 border border-white/10 p-6 rounded-xl flex-grow flex flex-col">
                <div class="flex justify-between items-center border-b border-white/10 pb-2 mb-4">
                    <h2 class="font-serif text-lg text-white">2. Article Ledger</h2>
                    <button id="new-btn" class="font-ui text-[9px] uppercase tracking-widest text-saviere-gold hover:text-white border border-saviere-gold/30 px-2 py-1 rounded">New Post</button>
                </div>
                <div id="article-list" class="space-y-2 overflow-y-auto max-h-[50vh] pr-2">
                    <p class="text-xs text-white/40 italic">Connect to fetch publications...</p>
                </div>
            </div>
        </div>

        <!-- Editor Content -->
        <div class="lg:col-span-8 bg-white/5 border border-white/10 p-8 rounded-xl flex flex-col">
            <h2 class="font-serif text-2xl text-saviere-gold mb-6 border-b border-white/10 pb-4">3. Editorial Composer</h2>
            <form id="editor-form" class="space-y-6 flex-grow flex flex-col">
                <input type="hidden" id="post-id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block font-ui text-[10px] uppercase tracking-widest text-white/50 mb-2">Headline</label>
                        <input type="text" id="post-title" required class="w-full bg-black border border-white/20 px-4 py-3 rounded text-lg font-serif focus:outline-none focus:border-saviere-gold text-white">
                    </div>
                    <div>
                        <label class="block font-ui text-[10px] uppercase tracking-widest text-white/50 mb-2">Category</label>
                        <select id="post-category" class="w-full bg-black border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white">
                            <option value="Press Release">Press Release</option>
                            <option value="Company Announcement">Company Announcement</option>
                            <option value="Media Coverage">Media Coverage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-ui text-[10px] uppercase tracking-widest text-white/50 mb-2">Date</label>
                        <input type="text" id="post-date" required class="w-full bg-black border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white" placeholder="e.g. October 15, 2026">
                    </div>
                    <div>
                        <label class="block font-ui text-[10px] uppercase tracking-widest text-white/50 mb-2">State</label>
                        <select id="post-status" class="w-full bg-black border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white">
                            <option value="Published">Published (Live)</option>
                            <option value="Draft">Draft (Hidden)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-ui text-[10px] uppercase tracking-widest text-white/50 mb-2">Cover Image (Optional)</label>
                        <input type="file" id="post-media" accept="image/*" class="w-full bg-black border border-white/20 px-4 py-2 rounded text-xs focus:outline-none focus:border-saviere-gold text-white/70">
                        <input type="hidden" id="post-media-b64">
                    </div>
                </div>
                <div class="flex-grow flex flex-col">
                    <label class="block font-ui text-[10px] uppercase tracking-widest text-white/50 mb-2">Full Content</label>
                    <textarea id="post-content" required class="w-full flex-grow bg-black border border-white/20 px-4 py-3 rounded text-sm focus:outline-none focus:border-saviere-gold text-white min-h-[300px]" placeholder="Type your press release here..."></textarea>
                </div>
                <div class="flex gap-4 pt-4 border-t border-white/10">
                    <button type="submit" id="save-btn" disabled class="flex-grow bg-saviere-crimson text-white font-ui text-xs font-bold uppercase tracking-widest py-4 rounded hover:bg-saviere-gold hover:text-black transition-colors disabled:opacity-50">Push to Edge Cache</button>
                    <button type="button" id="delete-btn" class="hidden bg-red-900/50 text-red-200 border border-red-500/30 font-ui text-xs uppercase tracking-widest px-6 rounded hover:bg-red-600 transition-colors">Delete</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        let db = []; let currentSha = null;
        const els = {
            token: document.getElementById('gh-token'), repo: document.getElementById('gh-repo'),
            btnConnect: document.getElementById('connect-btn'), badge: document.getElementById('status-badge'),
            list: document.getElementById('article-list'), form: document.getElementById('editor-form'),
            btnSave: document.getElementById('save-btn'), btnDelete: document.getElementById('delete-btn'),
            btnNew: document.getElementById('new-btn'), mediaFile: document.getElementById('post-media'),
            fields: { id: document.getElementById('post-id'), title: document.getElementById('post-title'), category: document.getElementById('post-category'), date: document.getElementById('post-date'), status: document.getElementById('post-status'), content: document.getElementById('post-content'), mediaB64: document.getElementById('post-media-b64') }
        };

        els.mediaFile.addEventListener('change', e => {
            const f = e.target.files[0];
            if(f){ const r = new FileReader(); r.onload = ev => els.fields.mediaB64.value = ev.target.result; r.readAsDataURL(f); }
        });

        async function fetchAPI(method, body = null) {
            const tk = els.token.value; const rp = els.repo.value;
            if(!tk || !rp) throw new Error("Missing Credentials");
            const opts = { method, headers: { 'Authorization': `token ${tk}`, 'Content-Type': 'application/json' }};
            if(body) opts.body = JSON.stringify(body);
            const res = await fetch(`https://api.github.com/repos/${rp}/contents/press-data.json`, opts);
            if(!res.ok) throw new Error("API Denied");
            return await res.json();
        }

        els.btnConnect.addEventListener('click', async () => {
            els.badge.innerText = "Syncing..."; els.badge.className = "font-ui text-[10px] font-bold uppercase tracking-widest text-blue-400 border border-blue-400/30 px-3 py-1 bg-blue-400/10 rounded-sm";
            try {
                const data = await fetchAPI('GET');
                currentSha = data.sha;
                db = JSON.parse(decodeURIComponent(escape(window.atob(data.content))));
                els.badge.innerText = "Connected"; els.badge.className = "font-ui text-[10px] font-bold uppercase tracking-widest text-green-400 border border-green-400/30 px-3 py-1 bg-green-400/10 rounded-sm";
                els.btnSave.disabled = false; renderList();
            } catch(e) {
                els.badge.innerText = "Auth Failed"; els.badge.className = "font-ui text-[10px] font-bold uppercase tracking-widest text-red-400 border border-red-400/30 px-3 py-1 bg-red-400/10 rounded-sm";
            }
        });

        function renderList() {
            els.list.innerHTML = '';
            if(db.length === 0) { els.list.innerHTML = '<p class="text-xs text-white/40">No entries.</p>'; return; }
            [...db].reverse().forEach(post => {
                const d = document.createElement('div');
                d.className = "p-3 border border-white/10 rounded hover:border-saviere-gold cursor-pointer bg-black/20";
                d.innerHTML = `<p class="text-[9px] uppercase tracking-widest text-saviere-gold mb-1">${post.date} • ${post.status}</p><p class="font-serif text-sm text-white truncate">${post.title}</p>`;
                d.onclick = () => loadPost(post.id);
                els.list.appendChild(d);
            });
        }

        function loadPost(id) {
            const p = db.find(x => x.id === id); if(!p) return;
            els.fields.id.value = p.id; els.fields.title.value = p.title; els.fields.category.value = p.category;
            els.fields.date.value = p.date; els.fields.status.value = p.status; els.fields.content.value = p.content;
            els.fields.mediaB64.value = p.media || ''; els.btnDelete.classList.remove('hidden');
        }

        els.btnNew.addEventListener('click', () => { els.form.reset(); els.fields.id.value = ''; els.fields.mediaB64.value = ''; els.btnDelete.classList.add('hidden'); });

        els.form.addEventListener('submit', async e => {
            e.preventDefault();
            els.btnSave.innerText = "Encrypting & Pushing..."; els.btnSave.disabled = true;
            const post = { id: els.fields.id.value || Date.now().toString(), title: els.fields.title.value, category: els.fields.category.value, date: els.fields.date.value, status: els.fields.status.value, content: els.fields.content.value, media: els.fields.mediaB64.value };
            const idx = db.findIndex(x => x.id === post.id);
            if(idx >= 0) db[idx] = post; else db.push(post);
            await pushGH(`docs(press): Update ${post.title}`);
        });

        els.btnDelete.addEventListener('click', async () => {
            if(!els.fields.id.value || !confirm("Delete this record permanently?")) return;
            els.btnDelete.innerText = "Deleting..."; db = db.filter(x => x.id !== els.fields.id.value);
            await pushGH(`docs(press): Delete record`); els.btnNew.click();
        });

        async function pushGH(msg) {
            try {
                const b64 = window.btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))));
                const res = await fetchAPI('PUT', { message: msg, content: b64, sha: currentSha });
                currentSha = res.content.sha; renderList();
                els.btnSave.innerText = "Commit Successful"; els.btnDelete.innerText = "Delete";
            } catch(e) { alert(e.message); els.btnSave.innerText = "Push to Edge Cache"; }
            setTimeout(() => { els.btnSave.innerText = "Push to Edge Cache"; els.btnSave.disabled = false; }, 3000);
        }
    </script>
</body>
</html>
